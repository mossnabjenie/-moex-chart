<script>
(function(){
'use strict';

try{
if('serviceWorker' in navigator){
navigator.serviceWorker.getRegistrations().then(function(rs){rs.forEach(function(r){r.unregister();});});
if(window.caches&&caches.keys){caches.keys().then(function(ks){ks.forEach(function(k){caches.delete(k);});});}
}
}catch(e){}

var BASE='https://iss.moex.com/iss/engines/stock/markets/shares/boards/TQBR';
var SEC_URL=BASE+'/securities.json?iss.meta=off&iss.only=securities&securities.columns=SECID,SHORTNAME';

var PRIORITY_GROUPS=[
['VKCO'],
['OZON'],
['AFKS'],
['X5','FIVE']
];

var TF_LIST=[
{key:'10m',label:'10м',iss:10,agg:1},
{key:'15m',label:'15м',iss:1,agg:15},
{key:'30m',label:'30м',iss:10,agg:3},
{key:'1h',label:'1ч',iss:60,agg:1},
{key:'2h',label:'2ч',iss:60,agg:2},
{key:'4h',label:'4ч',iss:60,agg:4},
{key:'1d',label:'1Д',iss:24,agg:1},
{key:'1w',label:'1Н',iss:7,agg:1},
{key:'1M',label:'1М',iss:31,agg:1}
];
var TF_BY_KEY={};TF_LIST.forEach(function(t){TF_BY_KEY[t.key]=t;});
var REFRESH_MS=12000;
var MAX_CANDLES=10000;
var PAGE_SIZE=500;
var MSK_OFFSET=3*3600*1000;
var END_HOUR_MSK=23,END_MIN_MSK=50;

var EMA20_COLOR='#ffffff';
var EMA200_COLOR='#4fc3f7';
var EMA_WIDTH=2;

var $=function(s){return document.querySelector(s);};
function pad2(n){return (n<10?'0':'')+n;}
function moexToMs(b){return Date.parse(String(b).replace(' ','T')+'+03:00');}
function fmtNum(v){return v==null?'—':(+v).toFixed(Math.abs(v)<10?3:2);}
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];});}
function todayStr(){var d=new Date();return d.getFullYear()+'-'+pad2(d.getMonth()+1)+'-'+pad2(d.getDate());}
function daysAgoStr(n){var d=new Date(Date.now()-n*86400000);return d.getFullYear()+'-'+pad2(d.getMonth()+1)+'-'+pad2(d.getDate());}
function fmtShort(ts){var d=new Date(ts);return pad2(d.getDate())+'.'+pad2(d.getMonth()+1)+'.'+String(d.getFullYear()).slice(-2);}
function fmtHm(ts){var d=new Date(ts);return pad2(d.getHours())+':'+pad2(d.getMinutes());}

function priorityRank(sec){
for(var i=0;i<PRIORITY_GROUPS.length;i++){
if(PRIORITY_GROUPS[i].indexOf(sec)>=0)return i;
}
return 1000;
}

/* ИСПРАВЛЕНО: fmtCountdown теперь обрабатывает отрицательные значения */
function fmtCountdown(ms){
if(ms===0)return '—';
var neg = ms < 0;
var a = Math.abs(ms);
var s=Math.floor(a/1000);
var h=Math.floor(s/3600),m=Math.floor((s%3600)/60),sec=s%60;
var str;
if(h>=24)str=Math.floor(h/24)+'д '+pad2(h%24)+':'+pad2(m)+':'+pad2(sec);
else if(h>0)str=pad2(h)+':'+pad2(m)+':'+pad2(sec);
else str=pad2(m)+':'+pad2(sec);
return neg ? '−'+str : str;
}

function fetchJson(url){
return new Promise(function(resolve,reject){
var ctrl=new AbortController();
var t=setTimeout(function(){ctrl.abort();},30000);
fetch(url,{signal:ctrl.signal,cache:'no-store'}).then(function(res){
clearTimeout(t);
if(!res.ok)throw new Error('HTTP '+res.status);
return res.json();
}).then(resolve).catch(function(e){clearTimeout(t);reject(e);});
});
}

function loadSecurities(){
return fetchJson(SEC_URL).then(function(j){
var d=(j.securities&&j.securities.data)||[];
var cols=(j.securities&&j.securities.columns)||['SECID','SHORTNAME'];
var iSec=cols.indexOf('SECID'),iName=cols.indexOf('SHORTNAME');
var list=[],seen={};
d.forEach(function(r){
var sec=String(r.at(iSec)),name=String(r.at(iName)||sec);
if(!sec||seen[sec])return;seen[sec]=1;
list.push({sec:sec,name:name});
});
list.sort(function(a,b){return a.sec.localeCompare(b.sec);});
return list;
});
}

function candlesPerDay(tf){
if(tf.iss===24)return 1;
if(tf.iss===7)return 1/5;
if(tf.iss===31)return 1/22;
return 480/(tf.iss*(tf.agg||1));
}

function fetchRangeReverse(ticker, tf, fromStr, tillStr, maxRows){
var all=[],start=0,guard=0;
function step(){
if(all.length>=maxRows)return Promise.resolve(all);
if(guard++>=400)return Promise.resolve(all);
var url=BASE+'/securities/'+encodeURIComponent(ticker)+'/candles.json'
+'?interval='+tf.iss+'&from='+fromStr+'&till='+tillStr
+'&start='+start+'&iss.reverse=true&iss.meta=off';
return fetchJson(url).then(function(j){
var c=j.candles;
if(!c||!Array.isArray(c.data)||c.data.length===0)return all;
var cols=c.columns||[];
var iO=cols.indexOf('open'),iC=cols.indexOf('close'),iH=cols.indexOf('high'),
iL=cols.indexOf('low'),iV=cols.indexOf('volume'),iB=cols.indexOf('begin');
for(var i=0;i<c.data.length;i++){
var r=c.data[i];
var ts=moexToMs(r.at(iB));
if(!isFinite(ts))continue;
all.push({t:ts,o:+r.at(iO),c:+r.at(iC),h:+r.at(iH),l:+r.at(iL),v:+r.at(iV)||0});
}
if(c.data.length<PAGE_SIZE)return all;
start+=PAGE_SIZE;
return step();
});
}
return step();
}

function loadAll(ticker, tf, targetMax, onProgress){
var collected={};
var today=todayStr();
var cpd=candlesPerDay(tf);
var startDays=Math.max(3,Math.ceil(1500/cpd*1.5));
if(startDays>365*50)startDays=365*50;

function step(days){
var fromStr=daysAgoStr(days);
var stillNeed=targetMax-Object.keys(collected).length;
var askMax=Math.max(stillNeed+800,1500);
return fetchRangeReverse(ticker,tf,fromStr,today,askMax).then(function(batch){
for(var i=0;i<batch.length;i++)collected[batch[i].t]=batch[i];
var total=Object.keys(collected).length;
if(onProgress)onProgress(total);
if(total>=targetMax)return;
if(days>=365*50)return;
var newDays=Math.min(Math.max(days*2, days+30),365*50);
return step(newDays);
});
}

return step(startDays).then(function(){
var arr=[];
for(var k in collected)arr.push(collected[k]);
arr.sort(function(a,b){return a.t-b.t;});
if(arr.length>targetMax)arr=arr.slice(-targetMax);
return arr;
});
}

function loadTail(ticker, tf, nCandles){
var cpd=candlesPerDay(tf);
var days=Math.max(2,Math.ceil(nCandles/cpd*1.6));
if(days>365*50)days=365*50;
return fetchRangeReverse(ticker,tf,daysAgoStr(days),todayStr(),Math.max(nCandles*2,800));
}

function aggregate(candles,agg){
if(!agg||agg<=1)return candles;
var res=[];
for(var i=0;i<candles.length;i+=agg){
var chunk=candles.slice(i,i+agg);
if(!chunk.length)continue;
var o=chunk[0].o,c=chunk[chunk.length-1].c,h=-Infinity,l=Infinity,v=0;
for(var j=0;j<chunk.length;j++){
if(chunk[j].h>h)h=chunk[j].h;
if(chunk[j].l<l)l=chunk[j].l;
v+=chunk[j].v;
}
res.push({t:chunk[0].t,o:o,c:c,h:h,l:l,v:v});
}
return res;
}

function computeEMA(values, period){
var n=values.length;
var ema=new Array(n);
if(n===0)return ema;
var k=2/(period+1);
var sum=0;
for(var i=0;i<n;i++){
if(i<period-1){ema[i]=null;sum+=values[i];}
else if(i===period-1){sum+=values[i];ema[i]=sum/period;}
else{ema[i]=values[i]*k+ema[i-1]*(1-k);}
}
return ema;
}

function recomputeIndicators(){
var closes=state.candles.map(function(c){return c.c;});
state.ema20=computeEMA(closes,20);
state.ema200=computeEMA(closes,200);
if(state.db.enabled){state.db.boxes=computeDarvas(state.candles,state.db.boxp);}else{state.db.boxes=[];}
}

function computeDarvas(candles, boxp){
var n=candles.length;
var boxes=[];
if(n<boxp+2||boxp<2)return boxes;

var k1=new Array(n),k2=new Array(n),k3=new Array(n),LL=new Array(n);
for(var i=0;i<n;i++){
var s1=Math.max(0,i-boxp+1);
var s2=Math.max(0,i-boxp+2);
var s3=Math.max(0,i-boxp+3);
var mx1=-Infinity,mx2=-Infinity,mx3=-Infinity,mn=Infinity;
for(var j=s1;j<=i;j++){if(candles[j].h>mx1)mx1=candles[j].h;if(candles[j].l<mn)mn=candles[j].l;}
for(var j2=s2;j2<=i;j2++){if(candles[j2].h>mx2)mx2=candles[j2].h;}
for(var j3=s3;j3<=i;j3++){if(candles[j3].h>mx3)mx3=candles[j3].h;}
k1[i]=mx1;k2[i]=mx2;k3[i]=mx3;LL[i]=mn;
}

var nh=NaN,barsSince=-1,topBox=NaN,bottomBox=NaN,topBoxPrev=NaN,bottomBoxPrev=NaN;
var activeBox=null;

for(var i2=0;i2<n;i2++){
var k1Prev=(i2>0)?k1[i2-1]:-Infinity;
if(i2>0 && candles[i2].h>k1Prev){nh=candles[i2].h;barsSince=0;}
else if(barsSince>=0){barsSince++;}

var box1=k3[i2]<k2[i2];
topBoxPrev=topBox;bottomBoxPrev=bottomBox;

if(barsSince===boxp-2 && box1){
topBox=nh;bottomBox=LL[i2];
}

var changed=false;
if(!isNaN(topBox)&&!isNaN(bottomBox)){
if(isNaN(topBoxPrev)||topBox!==topBoxPrev||bottomBox!==bottomBoxPrev)changed=true;
}

if(changed){
if(activeBox && activeBox.left<i2){activeBox.right=i2-1;boxes.push(activeBox);}
activeBox={left:i2,right:i2,top:topBox,bottom:bottomBox};
}else if(activeBox){
activeBox.right=i2;
}
}
if(activeBox)boxes.push(activeBox);
return boxes;
}

var state={
ticker:'VKCO',
tfKey:'10m',
candles:[],
rawIss:[],
ema20:[],
ema200:[],
view:{start:0,end:0},
viewPx:{min:0,max:0},
manualPx:false,
loading:false,
lastUpdate:0,
err:'',
db:{enabled:false,boxp:10,thickness:1.5,boxes:[]}
};
var securities=[];
var refreshTimer=null;

function renderTickerOptions(filter){
filter=filter||'';
var sel=$('#ticker');
var f=filter.trim().toLowerCase();
var items=!f?securities.slice():securities.filter(function(s){return s.sec.toLowerCase().indexOf(f)>=0||s.name.toLowerCase().indexOf(f)>=0;});
items.sort(function(a,b){
var ra=priorityRank(a.sec), rb=priorityRank(b.sec);
if(ra!==rb)return ra-rb;
return a.sec.localeCompare(b.sec);
});
var cur=state.ticker;
sel.innerHTML=items.map(function(s){return '<option value="'+esc(s.sec)+'">'+esc(s.sec)+' — '+esc(s.name)+'</option>';}).join('');
if(items.some(function(s){return s.sec===cur;}))sel.value=cur;
else if(items.length)sel.value=items[0].sec;
}

function setupUi(){
var tfs=$('#tfs');
tfs.innerHTML=TF_LIST.map(function(t){return '<button data-tf="'+t.key+'" class="'+(t.key===state.tfKey?'active':'')+'">'+t.label+'</button>';}).join('');
tfs.addEventListener('click',function(e){
var b=e.target.closest('button[data-tf]');
if(!b)return;
var key=b.dataset.tf;
if(key===state.tfKey)return;
state.tfKey=key;
var btns=tfs.querySelectorAll('button');
for(var i=0;i<btns.length;i++){btns[i].classList.toggle('active',btns[i].dataset.tf===key);}
reloadChart();
});
$('#ticker').addEventListener('change',function(e){state.ticker=e.target.value;reloadChart();});
$('#search').addEventListener('input',function(e){renderTickerOptions(e.target.value);});
$('#search').addEventListener('keydown',function(e){
if(e.key==='Enter'){
var first=$('#ticker').options[0];
if(first){$('#ticker').value=first.value;state.ticker=first.value;reloadChart();}
}
});

$('#btn-db').addEventListener('click',function(e){
e.stopPropagation();
$('#db-panel').classList.toggle('open');
});

$('#db-enabled').addEventListener('change',function(e){
state.db.enabled=e.target.checked;
saveDbSettings();
$('#btn-db').classList.toggle('active',state.db.enabled);
$('#db-badge').classList.toggle('on',state.db.enabled);
if(state.db.enabled){state.db.boxes=computeDarvas(state.candles,state.db.boxp);}else{state.db.boxes=[];}
draw();
});

$('#db-len').addEventListener('change',function(e){
var v=parseInt(e.target.value,10)||10;
v=Math.max(2,Math.min(200,v));
e.target.value=v;
state.db.boxp=v;
saveDbSettings();
$('#db-badge').textContent='Darvas '+v;
if(state.db.enabled){state.db.boxes=computeDarvas(state.candles,state.db.boxp);}
draw();
});

$('#db-reset').addEventListener('click',function(){
$('#db-len').value=10;
state.db.boxp=10;
saveDbSettings();
$('#db-badge').textContent='Darvas 10';
if(state.db.enabled){state.db.boxes=computeDarvas(state.candles,state.db.boxp);}
draw();
});

$('#db-thick').addEventListener('change',function(e){
var v=parseFloat(e.target.value)||1.5;
v=Math.max(1,Math.min(6,v));
e.target.value=v;
state.db.thickness=v;
saveDbSettings();
draw();
});
}

function saveDbSettings(){
try{
localStorage.setItem('db_enabled',state.db.enabled?'1':'0');
localStorage.setItem('db_boxp',String(state.db.boxp));
localStorage.setItem('db_thick',String(state.db.thickness));
}catch(e){}
}
function loadDbSettings(){
try{
if(localStorage.getItem('db_enabled')==='1')state.db.enabled=true;
var v=localStorage.getItem('db_boxp');if(v){var n=parseInt(v,10);if(n>=2&&n<=200)state.db.boxp=n;}
var t=localStorage.getItem('db_thick');if(t){var f=parseFloat(t);if(f>=1&&f<=6)state.db.thickness=f;}
}catch(e){}
$('#db-enabled').checked=state.db.enabled;
$('#db-len').value=state.db.boxp;
$('#db-thick').value=state.db.thickness;
$('#btn-db').classList.toggle('active',state.db.enabled);
$('#db-badge').classList.toggle('on',state.db.enabled);
$('#db-badge').textContent='Darvas '+state.db.boxp;
}

function setStatus(html,isErr){
var el=$('#status');
el.innerHTML=html;
el.style.color=isErr?'#ef5350':'';
}

function candleCloseMs(){
var tf=TF_BY_KEY[state.tfKey];
var last=state.candles.length?state.candles.at(-1):null;
if(!last)return 0;
if(tf.iss===24){
var md=new Date(last.t+MSK_OFFSET);
var endMsk=Date.UTC(md.getUTCFullYear(),md.getUTCMonth(),md.getUTCDate(),END_HOUR_MSK,END_MIN_MSK,0,0);
return endMsk-MSK_OFFSET;
}
if(tf.iss===7){
var md=new Date(last.t+MSK_OFFSET);
var dow=md.getUTCDay();
var add=(5-dow+7)%7;
var fri=Date.UTC(md.getUTCFullYear(),md.getUTCMonth(),md.getUTCDate()+add,END_HOUR_MSK,END_MIN_MSK,0,0);
return fri-MSK_OFFSET;
}
if(tf.iss===31){
var md=new Date(last.t+MSK_OFFSET);
var endMonth=Date.UTC(md.getUTCFullYear(),md.getUTCMonth()+1,0,END_HOUR_MSK,END_MIN_MSK,0,0);
return endMonth-MSK_OFFSET;
}
return last.t+tf.iss*60*1000*(tf.agg||1);
}

/* ИСПРАВЛЕНО: статус показывает "разрыв: N" если данные отстают */
function refreshStatus(){
var t=new Date(state.lastUpdate);
var upd=state.lastUpdate?pad2(t.getHours())+':'+pad2(t.getMinutes())+':'+pad2(t.getSeconds()):'—';
var first=state.candles.length?state.candles[0]:null;
var last=state.candles.length?state.candles.at(-1):null;
var price=last?fmtNum(last.c):'—';
var range=first&&last?(fmtShort(first.t)+'→'+fmtShort(last.t)):'—';
var lastTime=last?fmtHm(last.t):'—';
var cd='—';
if(state.candles.length){
var diff=candleCloseMs()-Date.now();
if(diff>0){
cd='закр. через '+fmtCountdown(diff);
}else if(diff<0){
cd='<span style="color:#ef5350">разрыв '+fmtCountdown(-diff)+'</span>';
}else{
cd='—';
}
}
if(state.err){
setStatus('<span style="color:#ef5350">Ошибка: '+esc(state.err)+'</span>',true);
}else{
setStatus('<b>'+esc(state.ticker)+'</b> '+price+' · '+state.candles.length+' св. · <b>'+range+'</b> · посл. '+lastTime+' · '+cd);
}
}

function mergeTail(tail){
if(!tail||!tail.length)return;
var map={},merged=[];
for(var i=0;i<state.rawIss.length;i++){map[state.rawIss[i].t]=state.rawIss[i];}
for(var j=0;j<tail.length;j++){map[tail[j].t]=tail[j];}
for(var k in map){merged.push(map[k]);}
merged.sort(function(a,b){return a.t-b.t;});
state.rawIss=merged;
var tf=TF_BY_KEY[state.tfKey];
state.candles=aggregate(merged,tf.agg);
}

function reloadChart(){
if(state.loading)return;
state.loading=true;
state.err='';
$('#loading').classList.remove('hide');
var tf=TF_BY_KEY[state.tfKey];
setStatus('Загрузка '+esc(state.ticker)+' · '+tf.label+' …');
loadAll(state.ticker,tf,MAX_CANDLES,function(n){
setStatus('Загрузка '+esc(state.ticker)+' · '+tf.label+' · '+n+' св. …');
}).then(function(raw){
if(!raw.length)throw new Error('Нет данных по '+state.ticker);
state.rawIss=raw;
state.candles=aggregate(raw,tf.agg);
var n=state.candles.length;
state.view.end=n-1;
state.view.start=Math.max(0,n-Math.min(120,n));
state.manualPx=false;
state.viewPx={min:0,max:0};
state.lastUpdate=Date.now();
recomputeIndicators();
refreshStatus();
}).catch(function(e){
state.err=(e&&e.message)?e.message:String(e);
refreshStatus();
console.error(e);
}).then(function(){
state.loading=false;
$('#loading').classList.add('hide');
draw();
});
}

function startAutoRefresh(){stopAutoRefresh();refreshTimer=setInterval(autoRefresh,REFRESH_MS);}
function stopAutoRefresh(){if(refreshTimer){clearInterval(refreshTimer);refreshTimer=null;}}

function autoRefresh(){
if(state.loading||!state.candles.length)return;
var tf=TF_BY_KEY[state.tfKey];
var oldLen=state.candles.length;
var wasAtEnd=(state.view.end>=oldLen-1);
var visibleCount=state.view.end-state.view.start;
loadTail(state.ticker,tf,600).then(function(raw){
if(!raw.length)return;
mergeTail(raw);
var newLen=state.candles.length;
if(wasAtEnd&&newLen>0){
state.view.end=newLen-1;
state.view.start=Math.max(0,state.view.end-visibleCount);
}
recomputeIndicators();
state.lastUpdate=Date.now();
state.err='';
refreshStatus();
draw();
}).catch(function(e){
state.err=(e&&e.message)?e.message:String(e);
refreshStatus();
});
}

var cv=$('#cv');
var ctx=cv.getContext('2d');
var DPR=Math.min(window.devicePixelRatio||1,2);
var cssW=0,cssH=0;
var LAYOUT={right:62,bottom:22,left:6,top:10,paddingRight:150};

function resize(){
var wrap=$('#chartWrap');
cssW=wrap.clientWidth;cssH=wrap.clientHeight;
cv.width=Math.floor(cssW*DPR);cv.height=Math.floor(cssH*DPR);
cv.style.width=cssW+'px';cv.style.height=cssH+'px';
ctx.setTransform(DPR,0,0,DPR,0,0);
draw();
}
function plotRect(){
return {
x:LAYOUT.left,
y:LAYOUT.top,
w:Math.max(10, cssW - LAYOUT.left - LAYOUT.right - LAYOUT.paddingRight),
h:Math.max(10, cssH - LAYOUT.top - LAYOUT.bottom)
};
}
function priceAxisX(rect){return rect.x + rect.w + LAYOUT.paddingRight;}
function priceRange(){
var c=state.candles;
if(!c.length)return {min:0,max:1};
if(state.manualPx && state.viewPx.max > state.viewPx.min){
return {min: state.viewPx.min, max: state.viewPx.max};
}
var s=Math.max(0,Math.min(state.view.start,c.length-1));
var e=Math.max(s,Math.min(state.view.end,c.length-1));
var mn=Infinity,mx=-Infinity;
for(var i=s;i<=e;i++){var k=c[i];if(k.l<mn)mn=k.l;if(k.h>mx)mx=k.h;}
if(state.db.enabled && state.db.boxes.length){
for(var b=0;b<state.db.boxes.length;b++){
var bx=state.db.boxes[b];
if(bx.right<s || bx.left>e)continue;
if(bx.top>mx)mx=bx.top;
if(bx.bottom<mn)mn=bx.bottom;
}
}
var ema20=state.ema20, ema200=state.ema200;
for(var i2=s;i2<=e;i2++){
var v1=ema20[i2], v2=ema200[i2];
if(v1!=null&&isFinite(v1)){if(v1<mn)mn=v1;if(v1>mx)mx=v1;}
if(v2!=null&&isFinite(v2)){if(v2<mn)mn=v2;if(v2>mx)mx=v2;}
}
if(!isFinite(mn)||!isFinite(mx))return {min:0,max:1};
var pad=(mx-mn)*0.08||Math.abs(mx)*0.01||1;
return {min:mn-pad,max:mx+pad};
}
function yForPrice(p,rect,rng){var k=(p-rng.min)/(rng.max-rng.min||1);return rect.y+rect.h-k*rect.h;}
function priceForY(y,rect,rng){var k=(rect.y+rect.h-y)/rect.h;return rng.min+k*(rng.max-rng.min);}
function getCss(v){return getComputedStyle(document.documentElement).getPropertyValue(v).trim()||'#888';}

function draw(){
ctx.clearRect(0,0,cssW,cssH);
var rect=plotRect(),rng=priceRange(),c=state.candles;
var s=Math.max(0,Math.min(state.view.start,Math.max(0,c.length-1)));
var e=Math.max(s,Math.min(state.view.end,Math.max(0,c.length-1)));
var visible=c.length?c.slice(s,e+1):[];
ctx.fillStyle=getCss('--bg');ctx.fillRect(0,0,cssW,cssH);
ctx.fillStyle=getCss('--chart-bg');ctx.fillRect(rect.x,rect.y,rect.w,rect.h);
ctx.fillStyle=getCss('--chart-bg');ctx.fillRect(rect.x+rect.w, rect.y, LAYOUT.paddingRight, rect.h);
if(!visible.length){
ctx.fillStyle=getCss('--muted');ctx.font='13px sans-serif';ctx.textAlign='center';
ctx.fillText('Нет данных',rect.x+rect.w/2,rect.y+rect.h/2);return;
}
drawGrid(rect,rng,visible);

if(state.db.enabled && state.db.boxes.length)drawDarvas(rect,rng,s,visible.length);

var count=visible.length;
var slot=rect.w/count;
var bw=Math.max(1,Math.min(14,slot*0.7));
var upC=getCss('--up'),dnC=getCss('--down');
for(var i=0;i<count;i++){
var k=visible[i];
var cx=rect.x+(i+0.5)*slot;
var up=k.c>=k.o;
ctx.strokeStyle=up?upC:dnC;ctx.fillStyle=up?upC:dnC;
var yH=yForPrice(k.h,rect,rng),yL=yForPrice(k.l,rect,rng);
ctx.beginPath();ctx.moveTo(cx,yH);ctx.lineTo(cx,yL);ctx.stroke();
var yO=yForPrice(k.o,rect,rng),yC=yForPrice(k.c,rect,rng);
var top=Math.min(yO,yC),hh=Math.max(1,Math.abs(yC-yO));
if(bw>=2)ctx.fillRect(cx-bw/2,top,bw,hh);else ctx.fillRect(cx,top,1,hh);
}

drawEMA(rect,rng,s,count,state.ema200,EMA200_COLOR,EMA_WIDTH);
drawEMA(rect,rng,s,count,state.ema20,EMA20_COLOR,EMA_WIDTH);

var last=visible[visible.length-1];
var lastY=yForPrice(last.c,rect,rng);
var axisX=priceAxisX(rect);
ctx.save();ctx.strokeStyle=getCss('--accent');ctx.setLineDash([4,4]);
ctx.beginPath();ctx.moveTo(rect.x,lastY);ctx.lineTo(axisX,lastY);ctx.stroke();ctx.restore();
drawPriceTag(lastY,last.c,rect);
ctx.font='12px sans-serif';ctx.textAlign='left';
ctx.fillStyle=getCss('--muted');
var label=state.ticker+' · '+TF_BY_KEY[state.tfKey].label+' · '+visible.length+' св.';
if(state.manualPx)label+=' · Y-zoom (dbl-click)';
ctx.fillText(label,rect.x+6,rect.y+14);
ctx.font='11px sans-serif';
ctx.fillStyle=EMA20_COLOR;ctx.fillText('EMA20',rect.x+6,rect.y+28);
ctx.fillStyle=EMA200_COLOR;ctx.fillText('EMA200',rect.x+60,rect.y+28);

if(hover.active)drawCrosshair(rect,rng,hover.x,hover.y);
if(state.view.end>=state.candles.length-1)drawCountdownAtLastCandle(rect,rng,visible);
}

function drawEMA(rect,rng,startIdx,visibleCount,arr,color,width){
if(!arr||!arr.length)return;
var slot=rect.w/visibleCount;
ctx.save();
ctx.strokeStyle=color;ctx.lineWidth=width;ctx.lineJoin='round';
ctx.beginPath();
var started=false;
for(var i=0;i<visibleCount;i++){
var idx=startIdx+i;
var v=arr[idx];
if(v==null||!isFinite(v)){started=false;continue;}
var x=rect.x+(i+0.5)*slot;
var y=yForPrice(v,rect,rng);
if(!started){ctx.moveTo(x,y);started=true;}
else ctx.lineTo(x,y);
}
ctx.stroke();
ctx.restore();
}

function drawDarvas(rect,rng,startIdx,visibleCount){
var boxes=state.db.boxes;
var slot=rect.w/visibleCount;
var endIdx=startIdx+visibleCount-1;
for(var i=0;i<boxes.length;i++){
var b=boxes[i];
if(b.right<startIdx || b.left>endIdx)continue;
var relLeft=Math.max(0, b.left-startIdx);
var relRight=Math.min(visibleCount-1, b.right-startIdx);
var x1=rect.x+relLeft*slot;
var x2=rect.x+(relRight+1)*slot;
var yTop=yForPrice(b.top,rect,rng);
var yBottom=yForPrice(b.bottom,rect,rng);
var lastC=state.candles[b.right].c;
var r,g,bl;
if(lastC>b.top){r=32;g=188;bl=34;}
else if(lastC<b.bottom){r=255;g=25;bl=25;}
else{r=255;g=181;bl=34;}
ctx.save();
ctx.strokeStyle='rgba('+r+','+g+','+bl+',0.95)';
ctx.lineWidth=state.db.thickness;
ctx.strokeRect(x1,yTop,x2-x1,yBottom-yTop);
ctx.restore();
}
}

/* ИСПРАВЛЕНО: плашка красная при разрыве, показывает отрицательное время */
function drawCountdownAtLastCandle(rect,rng,visible){
var c=visible[visible.length-1];if(!c)return;
var closeMs=candleCloseMs();if(!closeMs)return;
var left=closeMs-Date.now();
var txt=fmtCountdown(left);
var isLag=(left<0);
var label='⏳ '+txt;
var count=visible.length;
var slot=rect.w/count;
var cx=rect.x+(count-0.5)*slot;
var yHigh=yForPrice(c.h,rect,rng);
var yLow=yForPrice(c.l,rect,rng);
ctx.save();ctx.font='bold 13px monospace';
var tw=ctx.measureText(label).width;
var w=tw+18,h=24;
var x=cx-w/2;
if(x<rect.x+2)x=rect.x+2;
if(x+w>rect.x+rect.w-2)x=rect.x+rect.w-2-w;
var y=yHigh-h-6;
if(y<rect.y+2)y=yLow+6;
if(y+h>rect.y+rect.h-2)y=rect.y+rect.h-2-h;
if(isLag){
ctx.fillStyle='rgba(239,83,80,0.92)';
ctx.strokeStyle='#b71c1c';
}else if(left===0){
ctx.fillStyle='rgba(125,134,148,0.5)';
ctx.strokeStyle=getCss('--muted');
}else{
ctx.fillStyle='rgba(240,160,32,0.92)';
ctx.strokeStyle='#c98a1a';
}
ctx.fillRect(x,y,w,h);
ctx.lineWidth=1;ctx.strokeRect(x,y,w,h);
ctx.fillStyle=isLag?'#fff':(left===0?getCss('--muted'):'#111');
ctx.textAlign='center';ctx.textBaseline='middle';
ctx.fillText(label,x+w/2,y+h/2+1);
ctx.textBaseline='alphabetic';ctx.restore();
}

function drawGrid(rect,rng,visible){
ctx.save();ctx.strokeStyle=getCss('--grid');ctx.fillStyle=getCss('--muted');
ctx.lineWidth=1;ctx.font='10px sans-serif';
var steps=8;ctx.textAlign='left';
var axisX=priceAxisX(rect);
for(var i=0;i<=steps;i++){
var p=rng.min+(rng.max-rng.min)*(i/steps);
var y=yForPrice(p,rect,rng);
ctx.beginPath();ctx.moveTo(rect.x,y);ctx.lineTo(axisX,y);ctx.stroke();
ctx.fillText(fmtNum(p),axisX+6,y+3);
}
var n=visible.length;
var target=Math.min(10,n);ctx.textAlign='center';
for(var j=0;j<target;j++){
var idx=Math.floor((n-1)*(j/Math.max(1,target-1)));
var k=visible[idx];
var x=rect.x+(idx+0.5)*(rect.w/n);
ctx.beginPath();ctx.moveTo(x,rect.y);ctx.lineTo(x,rect.y+rect.h);ctx.stroke();
var d=new Date(k.t);
var label=(state.tfKey==='1d'||state.tfKey==='1w'||state.tfKey==='1M')?pad2(d.getDate())+'.'+pad2(d.getMonth()+1):fmtHm(k.t);
ctx.fillText(label,x,rect.y+rect.h+14);
}
ctx.restore();
}
function drawPriceTag(y,price,rect){
ctx.save();ctx.fillStyle=getCss('--accent');
var x=priceAxisX(rect);
ctx.fillRect(x,y-9,LAYOUT.right-6,18);
ctx.fillStyle='#111';ctx.font='bold 11px sans-serif';ctx.textAlign='left';
ctx.fillText(fmtNum(price),x+4,y+4);ctx.restore();
}
function drawCrosshair(rect,rng,x,y){
if(x<rect.x||x>rect.x+rect.w||y<rect.y||y>rect.y+rect.h)return;
ctx.save();ctx.strokeStyle='rgba(215,221,229,.45)';ctx.setLineDash([3,3]);
ctx.beginPath();ctx.moveTo(x,rect.y);ctx.lineTo(x,rect.y+rect.h);ctx.stroke();
ctx.beginPath();ctx.moveTo(rect.x,y);ctx.lineTo(rect.x+rect.w,y);ctx.stroke();ctx.restore();
var p=priceForY(y,rect,rng);
var axisX=priceAxisX(rect);
ctx.save();ctx.fillStyle='#2a323d';
ctx.fillRect(axisX,y-9,LAYOUT.right-6,18);
ctx.fillStyle=getCss('--text');ctx.font='bold 11px sans-serif';ctx.textAlign='left';
ctx.fillText(fmtNum(p),axisX+4,y+4);ctx.restore();
}

var hover={active:false,x:0,y:0};
function updateHoverCandle(){
var rect=plotRect();
if(hover.x<rect.x||hover.x>rect.x+rect.w||hover.y<rect.y||hover.y>rect.y+rect.h){$('#ohlc').style.display='none';return;}
var n=state.view.end-state.view.start;if(n<=0)return;
var rel=(hover.x-rect.x)/rect.w;
var idx=Math.round(rel*n)+state.view.start;
var c=state.candles;
if(idx<0||idx>=c.length){$('#ohlc').style.display='none';return;}
showOhlc(c[idx]);
}
function showOhlc(k){
var el=$('#ohlc');
var d=new Date(k.t);
var dt=pad2(d.getDate())+'.'+pad2(d.getMonth()+1)+'.'+d.getFullYear()+' '+pad2(d.getHours())+':'+pad2(d.getMinutes());
var color=k.c>=k.o?getCss('--up'):getCss('--down');
el.innerHTML='<span>'+dt+'</span>  <b style="color:'+color+'">O '+fmtNum(k.o)+' H '+fmtNum(k.h)+' L '+fmtNum(k.l)+' C '+fmtNum(k.c)+'</b>  <span>V '+Math.round(k.v).toLocaleString('ru-RU')+'</span>';
el.style.display='block';
}
cv.addEventListener('mousemove',function(e){
var r=cv.getBoundingClientRect();
hover.active=true;hover.x=e.clientX-r.left;hover.y=e.clientY-r.top;
updateHoverCandle();draw();
});
cv.addEventListener('mouseleave',function(){
hover.active=false;$('#ohlc').style.display='none';draw();
});

function zoomHorizontalRight(factor){
var c=state.candles;
if(!c.length)return;
var n=state.view.end-state.view.start;
if(n<=0)return;
var newN=Math.round(n*factor);
newN=Math.max(10,Math.min(c.length-1,newN));
var ne=state.view.end;
var ns=ne-newN;
if(ns<0)ns=0;
state.view.start=ns;
state.view.end=ne;
draw();
}

function zoomVertical(factor, mouseY){
var c=state.candles;
if(!c.length)return;
var rect=plotRect();
var rng=priceRange();
var anchorPx=priceForY(mouseY,rect,rng);
var newMin=anchorPx-(anchorPx-rng.min)*factor;
var newMax=anchorPx+(rng.max-anchorPx)*factor;
var span=newMax-newMin;
if(span<0.0001)return;
if(span>(rng.max-rng.min)*100)return;
state.manualPx=true;
state.viewPx={min:newMin,max:newMax};
draw();
}

cv.addEventListener('wheel',function(e){
e.preventDefault();
var r=cv.getBoundingClientRect();
var mx=e.clientX-r.left;
var my=e.clientY-r.top;
var rect=plotRect();
var axisX=priceAxisX(rect);
var factor=e.deltaY>0?1.15:0.87;
if(my<rect.y||my>rect.y+rect.h)return;
if(mx>=axisX && mx<=axisX+LAYOUT.right){
zoomVertical(factor,my);
}else if(mx<axisX){
zoomHorizontalRight(factor);
}
},{passive:false});

cv.addEventListener('dblclick',function(e){
var r=cv.getBoundingClientRect();
var mx=e.clientX-r.left;
var rect=plotRect();
var axisX=priceAxisX(rect);
if(mx>=axisX){
state.manualPx=false;
state.viewPx={min:0,max:0};
draw();
}
});

var drag=null;
cv.addEventListener('mousedown',function(e){
var r=cv.getBoundingClientRect();
var mx=e.clientX-r.left;
var rect=plotRect();
if(mx<rect.x||mx>rect.x+rect.w)return;
drag={x:e.clientX,start:state.view.start,end:state.view.end};
});
window.addEventListener('mousemove',function(e){
if(!drag)return;
var rect=plotRect(),dx=e.clientX-drag.x,n=drag.end-drag.start;if(n<=0)return;
var shift=Math.round((dx/rect.w)*n);
var ns=drag.start-shift,ne=drag.end-shift,c=state.candles;
if(ns<0){ne-=ns;ns=0;}
if(ne>c.length-1){ns-=(ne-(c.length-1));ne=c.length-1;}
if(ns<0)ns=0;
state.view.start=ns;state.view.end=ne;draw();
});
window.addEventListener('mouseup',function(){drag=null;});

var touchDrag=null,pinch=null;
function touchDist(t1,t2){return Math.hypot(t2.clientX-t1.clientX,t2.clientY-t1.clientY);}
cv.addEventListener('touchstart',function(e){
var r=cv.getBoundingClientRect();
if(e.touches.length===1){
var t0=e.touches[0];
touchDrag={x:t0.clientX-r.left,start:state.view.start,end:state.view.end};
hover.active=true;hover.x=t0.clientX-r.left;hover.y=t0.clientY-r.top;
updateHoverCandle();draw();
}else if(e.touches.length===2){
pinch={d:touchDist(e.touches[0],e.touches[1]),n:state.view.end-state.view.start,mid:(e.touches[0].clientX+e.touches[1].clientX)/2-r.left,start:state.view.start,end:state.view.end};
touchDrag=null;
}
},{passive:true});
cv.addEventListener('touchmove',function(e){
var r=cv.getBoundingClientRect();
if(e.touches.length===1&&touchDrag){
var dx=(e.touches[0].clientX-r.left)-touchDrag.x;
var rect=plotRect(),n=touchDrag.end-touchDrag.start;if(n<=0)return;
var shift=Math.round((dx/rect.w)*n);
var ns=touchDrag.start-shift,ne=touchDrag.end-shift,c=state.candles;
if(ns<0){ne-=ns;ns=0;}
if(ne>c.length-1){ns-=(ne-(c.length-1));ne=c.length-1;}
if(ns<0)ns=0;
state.view.start=ns;state.view.end=ne;draw();
}else if(e.touches.length===2&&pinch){
var nd=touchDist(e.touches[0],e.touches[1]);
var factor=pinch.d/nd;
var rect2=plotRect();
var rel=Math.max(0,Math.min(1,(pinch.mid-rect2.x)/rect2.w));
var newN=Math.round(pinch.n*factor);
newN=Math.max(10,Math.min(state.candles.length,newN));
var anchor=pinch.start+rel*pinch.n;
var ns2=Math.round(anchor-rel*newN),ne2=ns2+newN;
if(ns2<0){ns2=0;ne2=newN;}
if(ne2>state.candles.length-1){ne2=state.candles.length-1;ns2=ne2-newN;}
if(ns2<0)ns2=0;
state.view.start=ns2;state.view.end=ne2;draw();
}
},{passive:true});
cv.addEventListener('touchend',function(){
touchDrag=null;pinch=null;hover.active=false;
$('#ohlc').style.display='none';draw();
},{passive:true});

function init(){
setupUi();
loadDbSettings();
resize();
window.addEventListener('resize',resize);
loadSecurities().then(function(list){
securities=list;
if(securities.some(function(s){return s.sec==='VKCO';})){state.ticker='VKCO';}
else if(securities.some(function(s){return s.sec==='SBER';})){state.ticker='SBER';}
else if(securities.length){state.ticker=securities[0].sec;}
renderTickerOptions();
$('#ticker').value=state.ticker;
return reloadChart();
}).then(function(){
startAutoRefresh();
setInterval(function(){
if(state.candles.length){
refreshStatus();
if(!drag&&!touchDrag)draw();
}
},1000);
}).catch(function(e){
