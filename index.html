<script>
(function(){
'use strict';

try{
if('serviceWorker' in navigator){
navigator.serviceWorker.getRegistrations().then(function(rs){rs.forEach(function(r){r.unregister();});});
if(window.caches&&caches.keys){caches.keys().then(function(ks){ks.forEach(function(k){caches.delete(k);});});}
}
}catch(e){}

var BASE='https://iss.moex.com/iss/engines/stock/markets/shares/boards/TQBR';
var SEC_URL=BASE+'/securities.json?iss.meta=off&iss.only=securities&securities.columns=SECID,SHORTNAME';

var PRIORITY_GROUPS=[['VKCO'],['OZON'],['AFKS'],['X5','FIVE'],['SMLT']];

var DB_DEFAULTS={
VKCO:24,
AFKS:30,
X5:33,
FIVE:33,
OZON:39,
SMLT:40
};

/* Время жизни ручного изменения длины бокса (мс). Через это время
   значение автоматически вернётся к DB_DEFAULTS[ticker]. */
var BOX_OVERRIDE_MS = 60000;

var TF_LIST=[
{key:'10m',label:'10м',iss:10,agg:1},
{key:'15m',label:'15м',iss:1,agg:15},
{key:'30m',label:'30м',iss:10,agg:3},
{key:'1h',label:'1ч',iss:60,agg:1},
{key:'2h',label:'2ч',iss:60,agg:2},
{key:'4h',label:'4ч',iss:60,agg:4},
{key:'1d',label:'1Д',iss:24,agg:1},
{key:'1w',label:'1Н',iss:7,agg:1},
{key:'1M',label:'1М',iss:31,agg:1}
];
var TF_BY_KEY={};TF_LIST.forEach(function(t){TF_BY_KEY[t.key]=t;});
var REFRESH_MS=12000;
var MAX_CANDLES=4000;
var TAIL_CANDLES=800;
var PAGE_SIZE=500;
var PARALLEL_BATCH=4;
var MEM_CACHE_MAX=8;
var MEM_CACHE_FRESH_MS=300000;
var MSK_OFFSET=3*3600*1000;
var END_HOUR_MSK=23,END_MIN_MSK=50;

var EMA20_COLOR='#ffffff';
var EMA20_WIDTH=1.5;
var EMA200_COLOR='#00bcd4';
var EMA200_WIDTH=1.5;

var $=function(s){return document.querySelector(s);};
function pad2(n){return (n<10?'0':'')+n;}
function moexToMs(b){return Date.parse(String(b).replace(' ','T')+'+03:00');}
function fmtNum(v){return v==null?'—':(+v).toFixed(Math.abs(v)<10?3:2);}
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];});}
function todayStr(){var d=new Date();return d.getFullYear()+'-'+pad2(d.getMonth()+1)+'-'+pad2(d.getDate());}
function daysAgoStr(n){var d=new Date(Date.now()-n*86400000);return d.getFullYear()+'-'+pad2(d.getMonth()+1)+'-'+pad2(d.getDate());}
function fmtShort(ts){var d=new Date(ts);return pad2(d.getDate())+'.'+pad2(d.getMonth()+1)+'.'+String(d.getFullYear()).slice(-2);}
function fmtHm(ts){var d=new Date(ts);return pad2(d.getHours())+':'+pad2(d.getMinutes());}

function priorityRank(sec){
for(var i=0;i<PRIORITY_GROUPS.length;i++){if(PRIORITY_GROUPS[i].indexOf(sec)>=0)return i;}
return 1000;
}

/* Возвращает АКТУАЛЬНУЮ длину бокса для тикера.
   Приоритет:
   1) Временный ручной override (если его время ещё не истекло) — для ЛЮБОГО тикера
   2) Дефолт из DB_DEFAULTS (для «наших» тикеров)
   3) Постоянная ручная настройка из localStorage (для остальных тикеров)
   4) 10
*/
function getBoxpForTicker(ticker){
try{
var ovRaw=localStorage.getItem('db_boxp_ov_'+ticker);
if(ovRaw){
var ov=JSON.parse(ovRaw);
if(ov && ov.val>=2 && ov.val<=200 && ov.until>Date.now()){
return ov.val;
}
localStorage.removeItem('db_boxp_ov_'+ticker);
}
}catch(e){}
if(DB_DEFAULTS[ticker])return DB_DEFAULTS[ticker];
try{
var stored=localStorage.getItem('db_boxp_'+ticker);
if(stored){var n=parseInt(stored,10);if(n>=2&&n<=200)return n;}
}catch(e){}
return 10;
}

/* Возвращает timestamp окончания override (или 0, если override нет/истёк). */
function getOverrideUntil(ticker){
try{
var ovRaw=localStorage.getItem('db_boxp_ov_'+ticker);
if(!ovRaw)return 0;
var ov=JSON.parse(ovRaw);
if(ov && ov.until>Date.now())return ov.until;
}catch(e){}
return 0;
}

/* Обновляет визуальный вид поля длины (подсветка, если активен override) */
function refreshDbLenFieldVisual(){
var el=$('#db-len-inline');
if(!el)return;
var until=getOverrideUntil(state.ticker);
if(until>0){
el.classList.add('temp-override');
var leftSec=Math.max(1,Math.ceil((until-Date.now())/1000));
el.title='Изменено вручную: '+state.db.boxp+' (вернётся к '+(DB_DEFAULTS[state.ticker]||'10')+' через '+leftSec+' сек)';
}else{
el.classList.remove('temp-override');
el.title='Длина бокса Darvas. Ручное изменение действует 1 минуту, потом возврат к дефолту.';
}
}

function fmtCountdown(ms){
if(ms===0)return '—';
var neg=ms<0;var a=Math.abs(ms);
var s=Math.floor(a/1000);
var h=Math.floor(s/3600),m=Math.floor((s%3600)/60),sec=s%60;
var str;
if(h>=24)str=Math.floor(h/24)+'д '+pad2(h%24)+':'+pad2(m)+':'+pad2(sec);
else if(h>0)str=pad2(h)+':'+pad2(m)+':'+pad2(sec);
else str=pad2(m)+':'+pad2(sec);
return neg?'−'+str:str;
}

function fetchJson(url){
return new Promise(function(resolve,reject){
var ctrl=new AbortController();
var t=setTimeout(function(){ctrl.abort();},30000);
fetch(url,{signal:ctrl.signal,cache:'no-store'}).then(function(res){
clearTimeout(t);
if(!res.ok)throw new Error('HTTP '+res.status);
return res.json();
}).then(resolve).catch(function(e){clearTimeout(t);reject(e);});
});
}

function loadSecurities(){
return fetchJson(SEC_URL).then(function(j){
var d=(j.securities&&j.securities.data)||[];
var cols=(j.securities&&j.securities.columns)||['SECID','SHORTNAME'];
var iSec=cols.indexOf('SECID'),iName=cols.indexOf('SHORTNAME');
var list=[],seen={};
d.forEach(function(r){
var sec=String(r.at(iSec)),name=String(r.at(iName)||sec);
if(!sec||seen[sec])return;seen[sec]=1;
list.push({sec:sec,name:name});
});
list.sort(function(a,b){return a.sec.localeCompare(b.sec);});
return list;
});
}

function candlesPerDay(tf){
if(tf.iss===24)return 1;
if(tf.iss===7)return 1/5;
if(tf.iss===31)return 1/22;
return 480/(tf.iss*(tf.agg||1));
}

function fetchRangeReverse(ticker, tf, fromStr, tillStr, maxRows){
var all=[];
function fetchPage(start){
var url=BASE+'/securities/'+encodeURIComponent(ticker)+'/candles.json'
+'?interval='+tf.iss+'&from='+fromStr+'&till='+tillStr
+'&start='+start+'&iss.reverse=true&iss.meta=off';
return fetchJson(url).then(function(j){return j.candles;}).catch(function(){return null;});
}
function parsePage(c){
if(!c||!Array.isArray(c.data)||c.data.length===0)return [];
var cols=c.columns||[];
var iO=cols.indexOf('open'),iC=cols.indexOf('close'),iH=cols.indexOf('high'),
iL=cols.indexOf('low'),iV=cols.indexOf('volume'),iB=cols.indexOf('begin');
var out=[];
for(var i=0;i<c.data.length;i++){
var r=c.data[i];
var ts=moexToMs(r.at(iB));
if(!isFinite(ts))continue;
out.push({t:ts,o:+r.at(iO),c:+r.at(iC),h:+r.at(iH),l:+r.at(iL),v:+r.at(iV)||0});
}
return out;
}
return fetchPage(0).then(function(firstPage){
var parsed=parsePage(firstPage);
for(var i=0;i<parsed.length;i++)all.push(parsed[i]);
if(!firstPage || !firstPage.data || firstPage.data.length<PAGE_SIZE)return all;
if(all.length>=maxRows)return all;
function wave(startOffset){
var starts=[];
for(var k=0;k<PARALLEL_BATCH;k++) starts.push(startOffset+k*PAGE_SIZE);
return Promise.all(starts.map(fetchPage)).then(function(pages){
var anyFull=false;
for(var i=0;i<pages.length;i++){
var p=pages[i];
var parsed2=parsePage(p);
for(var j=0;j<parsed2.length;j++)all.push(parsed2[j]);
if(p && p.data && p.data.length>=PAGE_SIZE)anyFull=true;
}
if(all.length>=maxRows)return all;
if(!anyFull)return all;
return wave(startOffset+PARALLEL_BATCH*PAGE_SIZE);
});
}
return wave(PAGE_SIZE);
});
}

function loadAll(ticker, tf, targetMax, onProgress){
var collected={};
var today=todayStr();
var cpd=candlesPerDay(tf);
var startDays=Math.max(3,Math.ceil(1500/cpd*1.5));
if(startDays>365*50)startDays=365*50;
function step(days){
var fromStr=daysAgoStr(days);
var stillNeed=targetMax-Object.keys(collected).length;
var askMax=Math.max(stillNeed+800,1500);
return fetchRangeReverse(ticker,tf,fromStr,today,askMax).then(function(batch){
for(var i=0;i<batch.length;i++)collected[batch[i].t]=batch[i];
var total=Object.keys(collected).length;
if(onProgress)onProgress(total);
if(total>=targetMax)return;
if(days>=365*50)return;
var newDays=Math.min(Math.max(days*2, days+30),365*50);
return step(newDays);
});
}
return step(startDays).then(function(){
var arr=[];
for(var k in collected)arr.push(collected[k]);
arr.sort(function(a,b){return a.t-b.t;});
if(arr.length>targetMax)arr=arr.slice(-targetMax);
return arr;
});
}

function loadTail(ticker, tf, nCandles){
var cpd=candlesPerDay(tf);
var days=Math.max(2,Math.ceil(nCandles/cpd*1.6));
if(days>365*50)days=365*50;
return fetchRangeReverse(ticker,tf,daysAgoStr(days),todayStr(),Math.max(nCandles*2,800));
}

function aggregate(candles,agg){
if(!agg||agg<=1)return candles;
var res=[];
for(var i=0;i<candles.length;i+=agg){
var chunk=candles.slice(i,i+agg);
if(!chunk.length)continue;
var o=chunk[0].o,c=chunk[chunk.length-1].c,h=-Infinity,l=Infinity,v=0;
for(var j=0;j<chunk.length;j++){
if(chunk[j].h>h)h=chunk[j].h;
if(chunk[j].l<l)l=chunk[j].l;
v+=chunk[j].v;
}
res.push({t:chunk[0].t,o:o,c:c,h:h,l:l,v:v});
}
return res;
}

function computeEMA(values, period){
var n=values.length;
var ema=new Array(n);
if(n===0)return ema;
var k=2/(period+1);
var sum=0;
for(var i=0;i<n;i++){
if(i<period-1){ema[i]=null;sum+=values[i];}
else if(i===period-1){sum+=values[i];ema[i]=sum/period;}
else{ema[i]=values[i]*k+ema[i-1]*(1-k);}
}
return ema;
}

function recomputeIndicators(){
var closes=state.candles.map(function(c){return c.c;});
state.ema20=computeEMA(closes,state.ema20p||20);
state.ema200=computeEMA(closes,state.ema200p||200);
if(state.db.enabled){state.db.boxes=computeDarvas(state.candles,state.db.boxp);}else{state.db.boxes=[];}
}

function computeDarvas(candles, boxp){
var n=candles.length;
var boxes=[];
if(n<boxp+2||boxp<2)return boxes;
var k1=new Array(n),k2=new Array(n),k3=new Array(n),LL=new Array(n);
for(var i=0;i<n;i++){
var s1=Math.max(0,i-boxp+1);
var s2=Math.max(0,i-boxp+2);
var s3=Math.max(0,i-boxp+3);
var mx1=-Infinity,mx2=-Infinity,mx3=-Infinity,mn=Infinity;
for(var j=s1;j<=i;j++){if(candles[j].h>mx1)mx1=candles[j].h;if(candles[j].l<mn)mn=candles[j].l;}
for(var j2=s2;j2<=i;j2++){if(candles[j2].h>mx2)mx2=candles[j2].h;}
for(var j3=s3;j3<=i;j3++){if(candles[j3].h>mx3)mx3=candles[j3].h;}
k1[i]=mx1;k2[i]=mx2;k3[i]=mx3;LL[i]=mn;
}
var nh=NaN,barsSince=-1,topBox=NaN,bottomBox=NaN,topBoxPrev=NaN,bottomBoxPrev=NaN;
var activeBox=null;
for(var i2=0;i2<n;i2++){
var k1Prev=(i2>0)?k1[i2-1]:-Infinity;
if(i2>0 && candles[i2].h>k1Prev){nh=candles[i2].h;barsSince=0;}
else if(barsSince>=0){barsSince++;}
var box1=k3[i2]<k2[i2];
topBoxPrev=topBox;bottomBoxPrev=bottomBox;
if(barsSince===boxp-2 && box1){topBox=nh;bottomBox=LL[i2];}
var changed=false;
if(!isNaN(topBox)&&!isNaN(bottomBox)){
if(isNaN(topBoxPrev)||topBox!==topBoxPrev||bottomBox!==bottomBoxPrev)changed=true;
}
if(changed){
if(activeBox && activeBox.left<i2){activeBox.right=i2-1;boxes.push(activeBox);}
activeBox={left:i2,right:i2,top:topBox,bottom:bottomBox};
}else if(activeBox){
activeBox.right=i2;
}
}
if(activeBox)boxes.push(activeBox);
return boxes;
}

ticker:'VKCO',tfKey:'10m',candles:[],rawIss:[],ema20:[],ema200:[],
ema20p:20,ema200p:200,
view:{start:0,end:0},viewPx:{min:0,max:0},manualPx:false,

var children=header.children;

var el=children[i];
if(el.classList.contains('row')){el.style.display='';}
else{el.style.display=uiCollapse.headerCollapsed?'none':'';}

if(drawPanel){drawPanel.style.display=uiCollapse.drawPanelHidden?'none':'';}

/* ========== РИСОВАНИЕ ЛИНИЙ ========== */
var drawState={mode:null,color:'#ffeb3b',pendingPoint:null,selectedId:null,draggingPoint:null,nextId:1};
var lines=[];

function linesStorageKey(ticker){return 'moex_lines_v2_'+ticker;}
function nearestCandleTime(i){
var c=state.candles;if(!c||!c.length)return null;
var idx=Math.round(i);if(idx<0)idx=0;if(idx>c.length-1)idx=c.length-1;
return c[idx].t;
}
function timeToIndex(t){
var c=state.candles;if(!c||!c.length)return null;
if(!isFinite(t))return null;
if(t<=c[0].t)return 0;
if(t>=c[c.length-1].t)return c.length-1;
var lo=0,hi=c.length-1;
while(lo<=hi){var mid=(lo+hi)>>1;if(c[mid].t===t)return mid;if(c[mid].t<t)lo=mid+1;else hi=mid-1;}
var a=Math.max(0,lo-1),b=Math.min(c.length-1,lo);
return (Math.abs(c[a].t-t)<=Math.abs(c[b].t-t))?a:b;
}
function remapLines(){
for(var i=0;i<lines.length;i++){
var ln=lines[i];
if(ln.t1!=null){var ni=timeToIndex(ln.t1);if(ni!=null)ln.i1=ni;}
if(ln.t2!=null){var nj=timeToIndex(ln.t2);if(nj!=null)ln.i2=nj;}
}
}
function saveLines(){
try{
if(!state.candles.length)return;
var arr=[];
for(var i=0;i<lines.length;i++){
var ln=lines[i];
var t1=nearestCandleTime(ln.i1);var t2=nearestCandleTime(ln.i2);
if(t1==null||t2==null)continue;
ln.t1=t1;ln.t2=t2;
arr.push({t1:t1,p1:ln.p1,t2:t2,p2:ln.p2,color:ln.color});
}
localStorage.setItem(linesStorageKey(state.ticker),JSON.stringify(arr));
}catch(e){}
}
function loadLinesForTicker(ticker){
lines=[];drawState.selectedId=null;drawState.pendingPoint=null;drawState.draggingPoint=null;
try{
var raw=localStorage.getItem(linesStorageKey(ticker));
if(!raw)return;
var arr=JSON.parse(raw);if(!Array.isArray(arr))return;
for(var i=0;i<arr.length;i++){
var it=arr[i];if(!it)continue;
var i1=timeToIndex(it.t1);var i2=timeToIndex(it.t2);
if(i1==null||i2==null)continue;
lines.push({id:drawState.nextId++,i1:i1,p1:it.p1,t1:it.t1,i2:i2,p2:it.p2,t2:it.t2,color:it.color||'#ffeb3b'});
}
}catch(e){}
}

function pxToData(px, py, rect, rng){
var viewSpan = Math.max(1, state.view.end - state.view.start);
var i = state.view.start + ((px - rect.x) / rect.w) * viewSpan;
var p = priceForY(py, rect, rng);
return {i:i,p:p};
}
function pointToSegmentDist(px, py, x1, y1, x2, y2){
var dx = x2 - x1, dy = y2 - y1;
var len2 = dx*dx + dy*dy;
if(len2 === 0) return Math.hypot(px - x1, py - y1);
var t = Math.max(0, Math.min(1, ((px - x1)*dx + (py - y1)*dy) / len2));
var px2 = x1 + t*dx, py2 = y1 + t*dy;
return Math.hypot(px - px2, py - py2);
}
function hitTestLine(px, py, rect, rng){
var viewSpan = Math.max(1, state.view.end - state.view.start);
for(var i=lines.length-1;i>=0;i--){
var ln = lines[i];
var x1 = rect.x + (ln.i1 - state.view.start) / viewSpan * rect.w;
var y1 = yForPrice(ln.p1, rect, rng);
var x2 = rect.x + (ln.i2 - state.view.start) / viewSpan * rect.w;
var y2 = yForPrice(ln.p2, rect, rng);
if(pointToSegmentDist(px, py, x1, y1, x2, y2) < 8) return ln;
}
return null;
}
function hitTestPoint(px, py, rect, rng){
if(!drawState.selectedId) return null;
var viewSpan = Math.max(1, state.view.end - state.view.start);
for(var i=0;i<lines.length;i++){
var ln = lines[i];
if(ln.id !== drawState.selectedId) continue;
var x1 = rect.x + (ln.i1 - state.view.start) / viewSpan * rect.w;
var y1 = yForPrice(ln.p1, rect, rng);
var x2 = rect.x + (ln.i2 - state.view.start) / viewSpan * rect.w;
var y2 = yForPrice(ln.p2, rect, rng);
if(Math.hypot(px - x1, py - y1) < 9) return {line: ln, which: 1};
if(Math.hypot(px - x2, py - y2) < 9) return {line: ln, which: 2};
}
return null;
}
function drawLines(rect, rng){
var viewStart = state.view.start;
var viewSpan = Math.max(1, state.view.end - viewStart);
for(var i=0;i<lines.length;i++){
var ln = lines[i];
var x1 = rect.x + (ln.i1 - viewStart) / viewSpan * rect.w;
var y1 = yForPrice(ln.p1, rect, rng);
var x2 = rect.x + (ln.i2 - viewStart) / viewSpan * rect.w;
var y2 = yForPrice(ln.p2, rect, rng);
var isSel = (ln.id === drawState.selectedId);
ctx.save();ctx.strokeStyle = ln.color;ctx.lineWidth = isSel ? 3 : 2;
ctx.beginPath();ctx.moveTo(x1, y1);ctx.lineTo(x2, y2);ctx.stroke();
if(isSel){
ctx.fillStyle = ln.color;ctx.strokeStyle = '#000';ctx.lineWidth = 1;
ctx.beginPath();ctx.arc(x1, y1, 6, 0, Math.PI*2);ctx.fill();ctx.stroke();
ctx.beginPath();ctx.arc(x2, y2, 6, 0, Math.PI*2);ctx.fill();ctx.stroke();
}
ctx.restore();
if(isSel){
if(y1>=rect.y && y1<=rect.y+rect.h) drawAxisTag(rect, y1, ln.p1, '#7d8694', '#0b0f14');
if(y2>=rect.y && y2<=rect.y+rect.h) drawAxisTag(rect, y2, ln.p2, '#7d8694', '#0b0f14');
}
}
if(drawState.mode === 'line' && drawState.pendingPoint && hover.active && hover.inPlot){
var pp = drawState.pendingPoint;
var x1 = rect.x + (pp.i - viewStart) / viewSpan * rect.w;
var y1 = yForPrice(pp.p, rect, rng);
ctx.save();ctx.strokeStyle = drawState.color;ctx.lineWidth = 2;ctx.setLineDash([5, 5]);
ctx.beginPath();ctx.moveTo(x1, y1);ctx.lineTo(hover.x, hover.y);ctx.stroke();ctx.restore();
ctx.save();ctx.fillStyle = drawState.color;
ctx.beginPath();ctx.arc(x1, y1, 4, 0, Math.PI*2);ctx.fill();ctx.restore();
}
}

function setStatus(html,isErr){var el=$('#status');el.innerHTML=html;el.style.color=isErr?'#ef5350':'';}

function candleCloseMs(){
var tf=TF_BY_KEY[state.tfKey];
var last=state.candles.length?state.candles.at(-1):null;
if(!last)return 0;
if(tf.iss===24){var md=new Date(last.t+MSK_OFFSET);var endMsk=Date.UTC(md.getUTCFullYear(),md.getUTCMonth(),md.getUTCDate(),END_HOUR_MSK,END_MIN_MSK,0,0);return endMsk-MSK_OFFSET;}
if(tf.iss===7){var md=new Date(last.t+MSK_OFFSET);var dow=md.getUTCDay();var add=(5-dow+7)%7;var fri=Date.UTC(md.getUTCFullYear(),md.getUTCMonth(),md.getUTCDate()+add,END_HOUR_MSK,END_MIN_MSK,0,0);return fri-MSK_OFFSET;}
if(tf.iss===31){var md=new Date(last.t+MSK_OFFSET);var endMonth=Date.UTC(md.getUTCFullYear(),md.getUTCMonth()+1,0,END_HOUR_MSK,END_MIN_MSK,0,0);return endMonth-MSK_OFFSET;}
return last.t+tf.iss*60*1000*(tf.agg||1);
}

function refreshStatus(){
var first=state.candles.length?state.candles[0]:null;
var last=state.candles.length?state.candles.at(-1):null;
var price=last?fmtNum(last.c):'—';
var range=first&&last?(fmtShort(first.t)+'→'+fmtShort(last.t)):'—';
var lastTime=last?fmtHm(last.t):'—';
var cd='—';
if(state.candles.length){
var diff=candleCloseMs()-Date.now();
if(diff>0){cd='закр. через '+fmtCountdown(diff);}
else if(diff<0){cd='<span style="color:#ef5350">разрыв '+fmtCountdown(-diff)+'</span>';}
}
if(state.err){setStatus('<span style="color:#ef5350">Ошибка: '+esc(state.err)+'</span>',true);}
else{
var bg=state.bgLoading?' · <span style="color:var(--accent)">фон.догрузка…</span>':'';
var ovl=getOverrideUntil(state.ticker);
var ovStr='';
if(ovl>0){
var secLeft=Math.max(1,Math.ceil((ovl-Date.now())/1000));
ovStr=' · <span style="color:var(--accent)">Darvas '+state.db.boxp+' (override, '+secLeft+'с)</span>';
}
setStatus('<b>'+esc(state.ticker)+'</b> '+price+' · '+state.candles.length+' св. · <b>'+range+'</b> · посл. '+lastTime+' · '+cd+bg+ovStr);
}
}

function mergeTail(tail){
if(!tail||!tail.length)return;
var map={},merged=[];
for(var i=0;i<state.rawIss.length;i++){map[state.rawIss[i].t]=state.rawIss[i];}
for(var j=0;j<tail.length;j++){map[tail[j].t]=tail[j];}
for(var k in map){merged.push(map[k]);}
merged.sort(function(a,b){return a.t-b.t;});
state.rawIss=merged;
state.candles=aggregate(merged,TF_BY_KEY[state.tfKey].agg);
}

function refreshInBackground(gen, tf){
var tickerAtStart=state.ticker;
var tfKeyAtStart=state.tfKey;
var oldCandles=state.candles;
var tStart=null,tEnd=null;
if(oldCandles.length){
var vs=Math.max(0,Math.min(oldCandles.length-1,Math.floor(state.view.start)));
var ve=Math.max(0,Math.min(oldCandles.length-1,Math.ceil(state.view.end)));
tStart=oldCandles[vs].t;tEnd=oldCandles[ve].t;
}
var wasAtEnd=(state.view.end>=oldCandles.length-2);
state.bgLoading=true;refreshStatus();
loadAll(state.ticker, tf, MAX_CANDLES, null).then(function(raw){
if(gen!==loadGen)return;
if(state.ticker!==tickerAtStart || state.tfKey!==tfKeyAtStart)return;
if(!raw.length)return;
var map={};
for(var i=0;i<raw.length;i++)map[raw[i].t]=raw[i];
for(var j=0;j<state.rawIss.length;j++)map[state.rawIss[j].t]=state.rawIss[j];
var merged=[];
for(var k in map)merged.push(map[k]);
merged.sort(function(a,b){return a.t-b.t;});
state.rawIss=merged;
state.candles=aggregate(merged,tf.agg);
state.lastUpdate=Date.now();state.err='';
remapLines();
if(wasAtEnd){
state.view.end=state.candles.length-1;
state.view.start=Math.max(0,state.view.end-Math.min(120,state.candles.length));
}else if(tStart!=null && tEnd!=null){
var ni=timeToIndex(tStart);var nj=timeToIndex(tEnd);
if(ni!=null && nj!=null && nj>ni){state.view.start=ni;state.view.end=nj;}
}
recomputeIndicators();
updateMemCache();
refreshStatus();draw();
}).catch(function(e){}).then(function(){
if(gen!==loadGen)return;
if(state.ticker!==tickerAtStart || state.tfKey!==tfKeyAtStart)return;
state.bgLoading=false;refreshStatus();
});
}

function reloadChart(){
var gen=++loadGen;
state.err='';
state.db.boxp = getBoxpForTicker(state.ticker);
$('#db-len-inline').value = state.db.boxp;
refreshDbLenFieldVisual();
var tf=TF_BY_KEY[state.tfKey];
var cacheKey=state.ticker+'|'+state.tfKey;
var cached=memCache[cacheKey];

if(cached && cached.candles && cached.candles.length){
state.rawIss=cached.rawIss;
state.candles=cached.candles;
var n=state.candles.length;
state.view.end=n-1;state.view.start=Math.max(0,n-Math.min(120,n));
state.manualPx=false;state.viewPx={min:0,max:0};
state.lastUpdate=cached.lastUpdate;
state.loading=false;$('#loading').classList.add('hide');
recomputeIndicators();loadLinesForTicker(state.ticker);
refreshStatus();draw();
if(Date.now()-cached.lastUpdate < MEM_CACHE_FRESH_MS){autoRefresh();}
else{refreshInBackground(gen, tf);}
return;
}

state.loading=true;
$('#loading').classList.remove('hide');
setStatus('Загрузка '+esc(state.ticker)+' · '+tf.label+' …');

loadTail(state.ticker, tf, TAIL_CANDLES).then(function(raw){
if(gen!==loadGen)return;
if(!raw.length)throw new Error('Нет данных по '+state.ticker);
state.rawIss=raw;
state.candles=aggregate(raw,tf.agg);
var n=state.candles.length;
state.view.end=n-1;state.view.start=Math.max(0,n-Math.min(120,n));
state.manualPx=false;state.viewPx={min:0,max:0};
state.lastUpdate=Date.now();
recomputeIndicators();loadLinesForTicker(state.ticker);updateMemCache();
refreshStatus();draw();
state.loading=false;$('#loading').classList.add('hide');
refreshInBackground(gen, tf);
}).catch(function(e){
if(gen!==loadGen)return;
state.err=(e&&e.message)?e.message:String(e);
refreshStatus();console.error(e);
state.loading=false;$('#loading').classList.add('hide');draw();
});
}

function startAutoRefresh(){stopAutoRefresh();refreshTimer=setInterval(autoRefresh,REFRESH_MS);}
function stopAutoRefresh(){if(refreshTimer){clearInterval(refreshTimer);refreshTimer=null;}}

function autoRefresh(){
if(state.loading||state.bgLoading||!state.candles.length)return;
if(drag||dragX||dragY||touchDrag||pinch||drawState.draggingPoint)return;
var tickerAtStart=state.ticker;
var tfKeyAtStart=state.tfKey;
var tf=TF_BY_KEY[state.tfKey];
var oldLen=state.candles.length;
var wasAtEnd=(state.view.end===oldLen-1);
var visibleCount=state.view.end-state.view.start;
loadTail(state.ticker,tf,600).then(function(raw){
if(state.ticker!==tickerAtStart || state.tfKey!==tfKeyAtStart) return;
if(!raw.length)return;
mergeTail(raw);
var newLen=state.candles.length;
if(wasAtEnd&&newLen>0){
var newEnd=newLen-1;var newStart=newEnd-visibleCount;
var clamped=clampView(newStart,newEnd);
state.view.start=clamped.start;state.view.end=clamped.end;
}
recomputeIndicators();
state.lastUpdate=Date.now();state.err='';
updateMemCache();refreshStatus();draw();
}).catch(function(e){
if(state.ticker!==tickerAtStart || state.tfKey!==tfKeyAtStart) return;
state.err=(e&&e.message)?e.message:String(e);refreshStatus();
});
}

function plotRect(){
return {x:LAYOUT.left,y:LAYOUT.top,w:Math.max(10,cssW-LAYOUT.left-LAYOUT.right-LAYOUT.paddingRight),h:Math.max(10,cssH-LAYOUT.top-LAYOUT.bottom)};
}
function priceAxisX(rect){return rect.x + rect.w + LAYOUT.paddingRight;}

function clampView(ns, ne){
var c=state.candles;
if(!c.length)return {start:ns,end:ne};
var span=ne-ns;if(span<=0){span=1;ne=ns+1;}
var overscroll=Math.max(15,Math.min(100,Math.floor(span*0.5)));
var minStart=-overscroll;var maxEnd=c.length-1+overscroll;
if(ns<minStart){ns=minStart;ne=ns+span;}
if(ne>maxEnd){ne=maxEnd;ns=ne-span;}
if(ns<minStart)ns=minStart;if(ne>maxEnd)ne=maxEnd;
return {start:ns,end:ne};
}

function priceRange(){
var c=state.candles;
if(!c.length)return {min:0,max:1};
if(state.manualPx && state.viewPx.max > state.viewPx.min)return {min:state.viewPx.min,max:state.viewPx.max};
var s=Math.max(0,state.view.start);var e=Math.min(c.length-1,state.view.end);
if(e<s){
var ref=(state.view.start>c.length-1)?c[c.length-1]:c[0];
var pad0=(ref.h-ref.l)*0.08 || Math.abs(ref.c)*0.01 || 1;
return {min:ref.l-pad0,max:ref.h+pad0};
}
var mn=Infinity,mx=-Infinity;
for(var i=s;i<=e;i++){var k=c[i];if(k.l<mn)mn=k.l;if(k.h>mx)mx=k.h;}
if(state.db.enabled && state.db.boxes.length){
for(var b=0;b<state.db.boxes.length;b++){
var bx=state.db.boxes[b];
if(bx.right<s || bx.left>e)continue;
if(bx.top>mx)mx=bx.top;if(bx.bottom<mn)mn=bx.bottom;
}
}
var ema20=state.ema20,ema200=state.ema200;
for(var i2=s;i2<=e;i2++){
var v1=ema20[i2],v2=ema200[i2];
if(v1!=null&&isFinite(v1)){if(v1<mn)mn=v1;if(v1>mx)mx=v1;}
if(v2!=null&&isFinite(v2)){if(v2<mn)mn=v2;if(v2>mx)mx=v2;}
}
if(!isFinite(mn)||!isFinite(mx))return {min:0,max:1};
var pad=(mx-mn)*0.08||Math.abs(mx)*0.01||1;
return {min:mn-pad,max:mx+pad};
}
function yForPrice(p,rect,rng){var k=(p-rng.min)/(rng.max-rng.min||1);return rect.y+rect.h-k*rect.h;}
function priceForY(y,rect,rng){var k=(rect.y+rect.h-y)/rect.h;return rng.min+k*(rng.max-rng.min);}
function getCss(v){return getComputedStyle(document.documentElement).getPropertyValue(v).trim()||'#888';}

function draw(){
ctx.clearRect(0,0,cssW,cssH);
var rect=plotRect();
var c=state.candles;
ctx.fillStyle=getCss('--bg');ctx.fillRect(0,0,cssW,cssH);
ctx.fillStyle=getCss('--chart-bg');ctx.fillRect(rect.x,rect.y,rect.w,rect.h);
ctx.fillStyle=getCss('--chart-bg');ctx.fillRect(rect.x+rect.w, rect.y, LAYOUT.paddingRight, rect.h);
if(!c.length){
ctx.fillStyle=getCss('--muted');ctx.font='13px sans-serif';ctx.textAlign='center';
ctx.fillText('Нет данных',rect.x+rect.w/2,rect.y+rect.h/2);return;
}
var viewStart=state.view.start;var viewEnd=state.view.end;
var viewSpan=viewEnd-viewStart;if(viewSpan<=0){viewSpan=1;viewEnd=viewStart+1;}
var rng=priceRange();
var s=Math.max(0,viewStart);var e=Math.min(c.length-1,viewEnd);
var hasVisible=(e>=s);var slot=rect.w/viewSpan;
drawGrid(rect,rng,viewStart,viewEnd,viewSpan);
if(!hasVisible){
ctx.fillStyle=getCss('--muted');ctx.font='13px sans-serif';ctx.textAlign='center';
ctx.fillText('Нет данных в видимой области',rect.x+rect.w/2,rect.y+rect.h/2);
ctx.font='12px sans-serif';ctx.textAlign='left';ctx.fillStyle=getCss('--muted');
ctx.fillText(state.ticker+' · '+TF_BY_KEY[state.tfKey].label,rect.x+6,rect.y+14);
if(hover.active)drawCrosshair(rect,rng,hover.x,hover.y);return;
}
if(state.db.enabled && state.db.boxes.length)drawDarvas(rect,rng,viewStart,viewEnd,viewSpan);
var bw=Math.max(1,Math.min(14,slot*0.7));
var upC=getCss('--up'),dnC=getCss('--down');
for(var idx=s;idx<=e;idx++){
var k=c[idx];var cx=rect.x+(idx-viewStart+0.5)*slot;
var up=k.c>=k.o;
ctx.strokeStyle=up?upC:dnC;ctx.fillStyle=up?upC:dnC;
var yH=yForPrice(k.h,rect,rng),yL=yForPrice(k.l,rect,rng);
ctx.beginPath();ctx.moveTo(cx,yH);ctx.lineTo(cx,yL);ctx.stroke();
var yO=yForPrice(k.o,rect,rng),yC=yForPrice(k.c,rect,rng);
var top=Math.min(yO,yC),hh=Math.max(1,Math.abs(yC-yO));
if(bw>=2)ctx.fillRect(cx-bw/2,top,bw,hh);else ctx.fillRect(cx,top,1,hh);
}
drawEMA(rect,rng,viewStart,viewEnd,viewSpan,state.ema200,EMA200_COLOR,EMA200_WIDTH);
drawEMA(rect,rng,viewStart,viewEnd,viewSpan,state.ema20,EMA20_COLOR,EMA20_WIDTH);
drawLines(rect, rng);
var lastIdx=e;var last=c[lastIdx];var lastY=yForPrice(last.c,rect,rng);
drawPriceTag(lastY,last.c,rect);
ctx.font='12px sans-serif';ctx.textAlign='left';ctx.fillStyle=getCss('--muted');
var visibleCount=e-s+1;
var label=state.ticker+' · '+TF_BY_KEY[state.tfKey].label+' · '+visibleCount+' св.';
if(state.manualPx)label+=' · Y-zoom (dbl-click)';
ctx.fillText(label,rect.x+6,rect.y+14);
ctx.font='11px sans-serif';
ctx.fillStyle=EMA20_COLOR;ctx.fillText('EMA'+state.ema20p,rect.x+6,rect.y+28);
ctx.fillStyle=EMA200_COLOR;ctx.fillText('EMA'+state.ema200p,rect.x+70,rect.y+28);
if(hover.active)drawCrosshair(rect,rng,hover.x,hover.y);
}

function drawEMA(rect,rng,viewStart,viewEnd,viewSpan,arr,color,width){
if(!arr||!arr.length)return;
var c=state.candles;var s=Math.max(0,viewStart);var e=Math.min(c.length-1,viewEnd);
if(e<s)return;
var slot=rect.w/viewSpan;
ctx.save();ctx.strokeStyle=color;ctx.lineWidth=width;ctx.lineJoin='round';
ctx.beginPath();var started=false;
for(var idx=s;idx<=e;idx++){
var v=arr[idx];if(v==null||!isFinite(v)){started=false;continue;}
var x=rect.x+(idx-viewStart+0.5)*slot;var y=yForPrice(v,rect,rng);
if(!started){ctx.moveTo(x,y);started=true;}else ctx.lineTo(x,y);
}
ctx.stroke();ctx.restore();
}

function drawDarvas(rect,rng,viewStart,viewEnd,viewSpan){
var boxes=state.db.boxes;var slot=rect.w/viewSpan;
for(var i=0;i<boxes.length;i++){
var b=boxes[i];
if(b.right<viewStart || b.left>viewEnd)continue;
var clipL=Math.max(b.left,viewStart);var clipR=Math.min(b.right,viewEnd);
var x1=rect.x+(clipL-viewStart)*slot;var x2=rect.x+(clipR+1-viewStart)*slot;
var yTop=yForPrice(b.top,rect,rng);var yBottom=yForPrice(b.bottom,rect,rng);
var lastC=state.candles[b.right].c;var r,g,bl;
if(lastC>b.top){r=32;g=188;bl=34;}else if(lastC<b.bottom){r=255;g=25;bl=25;}else{r=255;g=181;bl=34;}
ctx.save();ctx.strokeStyle='rgba('+r+','+g+','+bl+',0.95)';ctx.lineWidth=state.db.thickness;
ctx.strokeRect(x1,yTop,x2-x1,yBottom-yTop);ctx.restore();
}
}

function drawGrid(rect,rng,viewStart,viewEnd,viewSpan){
ctx.save();ctx.strokeStyle=getCss('--grid');ctx.fillStyle=getCss('--muted');
ctx.lineWidth=1;ctx.font='10px sans-serif';
var steps=8;ctx.textAlign='left';
var axisX=priceAxisX(rect);
for(var i=0;i<=steps;i++){
var p=rng.min+(rng.max-rng.min)*(i/steps);
var y=yForPrice(p,rect,rng);
ctx.beginPath();ctx.moveTo(rect.x,y);ctx.lineTo(axisX,y);ctx.stroke();
ctx.fillText(fmtNum(p),axisX+6,y+3);
}
var c=state.candles;var s=Math.max(0,viewStart);var e=Math.min(c.length-1,viewEnd);
if(e<s){ctx.restore();return;}
var actualCount=e-s+1;var slot=rect.w/viewSpan;
var target=Math.min(10,actualCount);
ctx.textAlign='center';
for(var j=0;j<target;j++){
var relIdx=target>1?Math.round((actualCount-1)*(j/(target-1))):0;
var idx=s+relIdx;var x=rect.x+(idx-viewStart+0.5)*slot;
ctx.beginPath();ctx.moveTo(x,rect.y);ctx.lineTo(x,rect.y+rect.h);ctx.stroke();
var k=c[idx];var d=new Date(k.t);
var label=(state.tfKey==='1d'||state.tfKey==='1w'||state.tfKey==='1M')?pad2(d.getDate())+'.'+pad2(d.getMonth()+1):fmtHm(k.t);
ctx.fillText(label,x,rect.y+rect.h+14);
}
ctx.restore();
}

function drawAxisTag(rect,y,price,bg,fg){
var x=priceAxisX(rect);
ctx.save();ctx.fillStyle=bg;ctx.fillRect(x,y-9,LAYOUT.right-6,18);
ctx.fillStyle=fg;ctx.font='bold 11px sans-serif';ctx.textAlign='left';
ctx.fillText(fmtNum(price),x+4,y+4);ctx.restore();
}
function drawPriceTag(y,price,rect){drawAxisTag(rect,y,price,getCss('--accent'),'#111');}

function drawCrosshair(rect,rng,x,y){
if(x<rect.x||x>rect.x+rect.w||y<rect.y||y>rect.y+rect.h)return;
ctx.save();ctx.strokeStyle='rgba(215,221,229,.45)';ctx.setLineDash([3,3]);
ctx.beginPath();ctx.moveTo(x,rect.y);ctx.lineTo(x,rect.y+rect.h);ctx.stroke();
ctx.beginPath();ctx.moveTo(rect.x,y);ctx.lineTo(rect.x+rect.w,y);ctx.stroke();ctx.restore();
var p=priceForY(y,rect,rng);var axisX=priceAxisX(rect);
ctx.save();ctx.fillStyle='#2a323d';ctx.fillRect(axisX,y-9,LAYOUT.right-6,18);
ctx.fillStyle=getCss('--text');ctx.font='bold 11px sans-serif';ctx.textAlign='left';
ctx.fillText(fmtNum(p),axisX+4,y+4);ctx.restore();

var hover={active:false,x:0,y:0,inPlot:false};

function updateCursor(mx,my){

if(dragY){cv.style.cursor='ns-resize';return;}

if(mx>=rect.x && mx<=rect.x+rect.w && my>=rect.y && my<=rect.y+rect.h && drawState.selectedId){

}
if(drawState.mode==='line'){cv.style.cursor='crosshair';return;}

function updateHoverCandle(){
var rect=plotRect();
if(hover.x<rect.x||hover.x>rect.x+rect.w||hover.y<rect.y||hover.y>rect.y+rect.h){$('#ohlc').style.display='none';return;}
var viewSpan=state.view.end-state.view.start;if(viewSpan<=0)return;
var rel=(hover.x-rect.x)/rect.w;

function showOhlc(k){

var dt=pad2(d.getDate())+'.'+pad2(d.getMonth()+1)+'.'+d.getFullYear()+' '+pad2(d.getHours())+':'+pad2(d.getMinutes());

el.style.display='block';

function zoomHorizontalRight(factor){
var c=state.candles;if(!c.length)return;
var n=state.view.end-state.view.start;if(n<=0)return;
var newN=Math.round(n*factor);newN=Math.max(10,Math.min(c.length-1,newN));
var ne=state.view.end;var ns=ne-newN;
var clamped=clampView(ns,ne);state.view.start=clamped.start;state.view.end=clamped.end;draw();
}
function zoomVertical(factor,mouseY){

var rect=plotRect();var rng=priceRange();
var anchorPx=priceForY(mouseY,rect,rng);
var newMin=anchorPx-(anchorPx-rng.min)*factor;
var newMax=anchorPx+(rng.max-anchorPx)*factor;
var span=newMax-newMin;

state.manualPx=true;state.viewPx={min:newMin,max:newMax};draw();
}

cv.addEventListener('wheel',function(e){

var r=cv.getBoundingClientRect();var mx=e.clientX-r.left;var my=e.clientY-r.top;
var rect=plotRect();var axisX=priceAxisX(rect);
var factor=e.deltaY>0?1.15:0.87;

if(mx>=axisX && mx<=axisX+LAYOUT.right){zoomVertical(factor,my);}
else if(mx<axisX){zoomHorizontalRight(factor);}
},{passive:false});

cv.addEventListener('dblclick',function(e){

var rect=plotRect();var axisX=priceAxisX(rect);

});

var drag=null,dragY=null,dragX=null;

cv.addEventListener('mousedown',function(e){
if(e.button!==0)return;
var r=cv.getBoundingClientRect();var mx=e.clientX-r.left;var my=e.clientY-r.top;
var rect=plotRect();var axisX=priceAxisX(rect);
if(mx>=rect.x && mx<=rect.x+rect.w && my>=rect.y && my<=rect.y+rect.h && drawState.selectedId){

var rng=priceRange();var clampY=Math.max(rect.y,Math.min(rect.y+rect.h,my));

else{if(drawState.selectedId){drawState.selectedId=null;draw();}}

drag={x:e.clientX,y:e.clientY,start:state.view.start,end:state.view.end,pxMin:rngStart.min,pxMax:rngStart.max,pxSpan:(rngStart.max-rngStart.min)||1};

window.addEventListener('mousemove',function(e){

}

var nMax=dragY.anchorPrice+(dragY.startMax-dragY.anchorPrice)*factorY;
if(nMax-nMin>1e-9){state.manualPx=true;state.viewPx={min:nMin,max:nMax};draw();}
return;
}

if(factorX<0.05)factorX=0.05;if(factorX>20)factorX=20;

var newN=Math.round(dragX.n*factorX);newN=Math.max(10,Math.min(c.length-1,newN));
var ns=Math.round(dragX.anchorIdx-dragX.rel*newN);var ne=ns+newN;

var ns2=drag.start-shift;var ne2=drag.end-shift;
var clamped=clampView(ns2,ne2);state.view.start=clamped.start;state.view.end=clamped.end;

if(dy2!==0){
var priceDelta=(dy2/rect.h)*drag.pxSpan;

window.addEventListener('mouseup',function(){

});

var touchDrag=null,pinch=null;
function touchDist(t1,t2){return Math.hypot(t2.clientX-t1.clientX,t2.clientY-t1.clientY);}

}else if(e.touches.length===2){
pinch={d:touchDist(e.touches[0],e.touches[1]),n:state.view.end-state.view.start,mid:(e.touches[0].clientX+e.touches[1].clientX)/2-r.left,start:state.view.start,end:state.view.end};

},{passive:true});
cv.addEventListener('touchmove',function(e){

if(e.touches.length===1&&touchDrag){
var dx=(e.touches[0].clientX-r.left)-touchDrag.x;
var dy=(e.touches[0].clientY-r.top)-touchDrag.y;
var rect=plotRect(),n=touchDrag.end-touchDrag.start;
if(n>0 && dx!==0){
var shift=Math.round((dx/rect.w)*n);
var ns=touchDrag.start-shift;var ne=touchDrag.end-shift;
var clampedT=clampView(ns,ne);state.view.start=clampedT.start;state.view.end=clampedT.end;

state.viewPx={min:touchDrag.pxMin+priceDelta,max:touchDrag.pxMax+priceDelta};

draw();
}else if(e.touches.length===2&&pinch){
var nd=touchDist(e.touches[0],e.touches[1]);
var factor=pinch.d/nd;var rect2=plotRect();
var rel=Math.max(0,Math.min(1,(pinch.mid-rect2.x)/rect2.w));
var newN=Math.round(pinch.n*factor);newN=Math.max(10,Math.min(state.candles.length,newN));
var anchor=pinch.start+rel*pinch.n;
var ns2=Math.round(anchor-rel*newN),ne2=ns2+newN;
var clampedP=clampView(ns2,ne2);state.view.start=clampedP.start;state.view.end=clampedP.end;draw();
}
},{passive:true});
cv.addEventListener('touchend',function(){
touchDrag=null;pinch=null;hover.active=false;
$('#ohlc').style.display='none';draw();
},{passive:true});

function init(){
setupUi();
setupDrawUi();
setupPanelToggle();
loadDbSettings();
loadEmaSettings();
resize();
window.addEventListener('resize',resize);
loadSecurities().then(function(list){
securities=list;
if(securities.some(function(s){return s.sec==='VKCO';})){state.ticker='VKCO';}
else if(securities.some(function(s){return s.sec==='SBER';})){state.ticker='SBER';}
else if(securities.length){state.ticker=securities[0].sec;}
renderTickerOptions();
$('#ticker').value=state.ticker;
state.db.boxp=getBoxpForTicker(state.ticker);
$('#db-len-inline').value=state.db.boxp;
refreshDbLenFieldVisual();
return reloadChart();
}).then(function(){
startAutoRefresh();
setInterval(function(){
/* Каждую секунду сверяем текущую длину бокса с фактической.
   Если истёк override — вернётся к дефолту автоматически.
   Также подчищаем подсветку поля. */
var elDb=document.getElementById('db-len-inline');
if(elDb && document.activeElement!==elDb){
var expected=getBoxpForTicker(state.ticker);
if(state.db.boxp!==expected){
state.db.boxp=expected;elDb.value=expected;
if(state.db.enabled){state.db.boxes=computeDarvas(state.candles,state.db.boxp);}draw();
}else if(parseInt(elDb.value,10)!==expected){elDb.value=expected;}
}
refreshDbLenFieldVisual();
if(state.candles.length){
refreshStatus();
if(!drag&&!dragY&&!dragX&&!touchDrag&&!drawState.draggingPoint)draw();
}
},1000);
}).catch(function(e){
state.err=(e&&e.message)?e.message:String(e);
refreshStatus();console.error(e);
});
}
init();

})();
</script>
</body>
</html>
